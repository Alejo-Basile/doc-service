name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - run: go vet ./...
      - run: test -z "$(gofmt -l .)" || (gofmt -l . && exit 1)

  unit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: tests hermeticos
        run: |
          PKGS=$(go list ./... | grep -vE 'internal/adapters/(mongo|changestream|relay|redis)$')
          go test -race -count=1 $PKGS

  integration:
    runs-on: ubuntu-latest
    services:
      mongo:
        image: mongo:7
        ports: ['27017:27017']
        options: >-
          --replSet rs0
          --health-cmd "mongosh --quiet --eval 'db.runCommand({ping:1})'"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
      redis:
        image: redis:7-alpine
        ports: ['6379:6379']
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: iniciar replica set
        run: |
          CID=$(docker ps -q -f ancestor=mongo:7)
          docker exec "$CID" mongosh --quiet --eval 'rs.initiate({_id:"rs0",members:[{_id:0,host:"localhost:27017"}]})'
          for i in $(seq 1 30); do
            if docker exec "$CID" mongosh --quiet --eval 'db.hello().isWritablePrimary' | grep -q true; then
              exit 0
            fi
            sleep 1
          done
          echo "replica set no arranco"
          exit 1
      - name: tests de integracion
        env:
          MONGO_TEST_URI: mongodb://127.0.0.1:27017/?replicaSet=rs0
          REDIS_TEST_ADDR: 127.0.0.1:6379
        run: go test -race -count=1 ./internal/adapters/mongo/... ./internal/adapters/changestream/... ./internal/adapters/relay/... ./internal/adapters/redis/...
