name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - run: go vet ./...
      - run: test -z "$(gofmt -l .)" || (gofmt -l . && exit 1)

  unit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: tests hermeticos
        run: |
          PKGS=$(go list ./... | grep -vE 'internal/adapters/(mongo|changestream|relay|redis)$')
          go test -race -count=1 $PKGS

  integration:
    runs-on: ubuntu-latest
    services:
      redis:
        image: redis:7-alpine
        ports: ['6379:6379']
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      # The mongo image needs mongod flags (--replSet), which service containers
      # cannot pass: GitHub turns `options` into `docker create` flags, not args.
      # Start it explicitly and initiate the single-node replica set.
      - name: iniciar mongo replica set
        run: |
          docker run -d --name mongo-rs -p 27017:27017 mongo:7 --replSet rs0 --bind_ip_all
          for i in $(seq 1 30); do
            if docker exec mongo-rs mongosh --quiet --eval 'db.runCommand({ping:1}).ok' 2>/dev/null | grep -q 1; then
              break
            fi
            sleep 1
          done
          docker exec mongo-rs mongosh --quiet --eval 'rs.initiate({_id:"rs0",members:[{_id:0,host:"localhost:27017"}]})'
          for i in $(seq 1 30); do
            if docker exec mongo-rs mongosh --quiet --eval 'db.hello().isWritablePrimary' | grep -q true; then
              exit 0
            fi
            sleep 1
          done
          echo "replica set no arranco"
          exit 1
      - name: iniciar minio
        run: |
          # bitnamilegacy/minio: su entrypoint ya arranca el server (setup ->
          # stop -> start). NO pasar "minio server ..." como command porque
          # sobreescribe el entrypoint y el server no queda escuchando (health
          # check en timeout).
          docker run -d --name minio -p 9000:9000 \
            -v minio-data:/bitnami/minio/data \
            -e MINIO_ROOT_USER=minioadmin \
            -e MINIO_ROOT_PASSWORD=minioadmin123 \
            bitnamilegacy/minio:2025.7.23-debian-12-r5
          for i in $(seq 1 60); do
            if curl -sf http://127.0.0.1:9000/minio/health/live >/dev/null; then
              exit 0
            fi
            sleep 1
          done
          echo "minio no arranco; logs del contenedor:"
          docker logs minio
          exit 1
      - name: tests de integracion
        env:
          MONGO_TEST_URI: mongodb://127.0.0.1:27017/?replicaSet=rs0
          REDIS_TEST_ADDR: 127.0.0.1:6379
          MINIO_TEST_ENDPOINT: 127.0.0.1:9000
          MINIO_TEST_ACCESS_KEY: minioadmin
          MINIO_TEST_SECRET_KEY: minioadmin123
        run: go test -race -count=1 ./internal/adapters/mongo/... ./internal/adapters/changestream/... ./internal/adapters/relay/... ./internal/adapters/redis/... ./internal/adapters/minio/...
